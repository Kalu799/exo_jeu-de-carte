<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu de carte</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>

  <header>

    <h1>Le jeu des cartes</h1>

    <div class="score">
      <p>Score :</p>
      <p class="points">0</p>
    </div>

    <div class="timer">
      <p>Temps restant :</p>
      <p class="temps">X</p><p>secondes</p>
    </div>

  </header>

  <main>

    <div class="carteContainer" id="carteOrdi">

    </div>

    <div class="carte drop hidden">Drop ici</div>

    <p class="txt hidden">Vos cartes :</p>
    <div class="carteContainer" id="cartesJoueur">

    </div>

    <div class="btnContainer">
      <button class="btn" id="startBtn">Start</button>
      <button class="btn hidden" id="skipBtn">Skip</button>
      <button class="btn hidden" id="replayBtn">Rejouer ?</button>
    </div>

  </main>
  
</body>
</html>
