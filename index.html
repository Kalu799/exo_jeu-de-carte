<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu de carte</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>

  <header>
    <h1>Le jeu des cartes</h1>
  </header>

  <main>

    <div class="carteContainer" id="carteOrdi">
      <div class="carte">Ordi</div>
    </div>

    <div class="carteContainer" id="cartesJoueur">
      <div class="carte">P1</div>
      <div class="carte">P2</div>
      <div class="carte">P3</div>
      <div class="carte">P4</div>
      <div class="carte">P5</div>
    </div>

    <div class="btnContainer">
      <button class="btn" id="startBtn">Start</button>
      <button class="btn hidden" id="skipBtn">Skip</button>
      <button class="btn hidden" id="replayBtn">Rejouer ?</button>
    </div>

  </main>
  
</body>
</html>
